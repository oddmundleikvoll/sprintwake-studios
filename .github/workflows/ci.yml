name: Sprintwake Studios CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build isolated native runtime and standalone app
        run: |
          test "$(uname -m)" = arm64
          ./scripts/setup.sh
      - name: Native unit tests, CTest and diff checks
        run: ./scripts/check.sh
      - name: Check pure contracts
        run: .venv/bin/python -B scripts/sync-contracts.py
      - name: Independent engine CPU checks without models
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          SPRINTWAKE_UPDATE_LOCK_ROOT: ${{ runner.temp }}/sprintwake-test-locks
          RAVEN_GPU_LOCK: ${{ runner.temp }}/sprintwake-test-gpu.lock
        run: |
          export PATH="$PWD/runtime/tools:$PATH"
          runtime/bundle-venv/bin/python -B -m unittest discover -s engine/tests -v
